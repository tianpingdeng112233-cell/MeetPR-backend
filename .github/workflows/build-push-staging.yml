name: Build & push staging image to ACR

on:
  push:
    branches: [staging]
  workflow_dispatch:

concurrency:
  group: build-push-staging
  cancel-in-progress: true

jobs:
  verify:
    name: Verify before image push
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm test
      - run: pnpm build

  build-push:
    name: Build & push linux/amd64 image
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Aliyun ACR
        uses: docker/login-action@v3
        with:
          registry: crpi-qh0hhca6eqlzbzy9.cn-hangzhou.personal.cr.aliyuncs.com
          username: ${{ secrets.ALIYUN_ACR_USERNAME }}
          password: ${{ secrets.ALIYUN_ACR_PASSWORD }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            crpi-qh0hhca6eqlzbzy9.cn-hangzhou.personal.cr.aliyuncs.com/meetpr/meetpr-backend:v0.1-staging
            crpi-qh0hhca6eqlzbzy9.cn-hangzhou.personal.cr.aliyuncs.com/meetpr/meetpr-backend:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
