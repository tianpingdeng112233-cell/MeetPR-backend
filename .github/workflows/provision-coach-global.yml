name: Provision a coach on the global database

# One-off, create-only QA operation on this branch. Never rotate an existing account.
# The database connection stays inside this job; the temporary QA password secret
# is removed after verification. The existing shared coach secret is untouched.

on:
  workflow_dispatch:
    inputs:
      email:
        description: 'Coach email (becomes the login)'
        type: string
        required: true
      timezone:
        description: 'IANA time zone for the coach'
        type: string
        required: true
        default: 'America/New_York'

concurrency:
  group: provision-coach-global
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  provision:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Install doctl
        uses: digitalocean/action-doctl@3cb3953159719656269e044e0e24ca16dd2a690f # v2.5.2
        with:
          token: ${{ secrets.DO_ACCESS_TOKEN }}

      - name: Provision coach
        env:
          COACH_EMAIL: ${{ inputs.email }}
          COACH_TIMEZONE: ${{ inputs.timezone }}
          COACH_PASSWORD: ${{ secrets.GLOBAL_QA_20260921_COACH_PASSWORD }}
        run: |
          set -euo pipefail
          if [ "$COACH_EMAIL" != "qa-rn22-coach-20260921@meetpr.app" ]; then
            echo "::error::only the dedicated QA coach is authorized"
            exit 1
          fi
          if [ -z "$COACH_PASSWORD" ]; then
            echo "::error::GLOBAL_QA_20260921_COACH_PASSWORD secret is not set"
            exit 1
          fi
          DB_ID=$(doctl databases list --format ID,Name --no-header | awk '$2=="meetpr-global-pg"{print $1}')
          if [ -z "$DB_ID" ]; then
            echo "::error::database cluster meetpr-global-pg not found"
            exit 1
          fi
          DATABASE_URL=$(doctl databases connection "$DB_ID" --format URI --no-header)
          export DATABASE_URL
          # The managed cluster presents a private CA; fetch it so the pool can
          # verify strictly instead of failing on "self-signed certificate".
          DATABASE_CA_CERT=$(doctl databases get-ca "$DB_ID" --format Certificate --no-header)
          export DATABASE_CA_CERT
          pnpm tsx scripts/provision-coach-global.ts
