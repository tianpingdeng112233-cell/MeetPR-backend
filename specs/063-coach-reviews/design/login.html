<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>登录 · 力量举教练点评</title>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@700;800;900&family=JetBrains+Mono:wght@400;500;700&family=Noto+Sans+SC:wght@400;500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="site.css">
<style>
.stage { position: relative; isolation: isolate; overflow: hidden; min-height: 860px; display: flex; flex-direction: column; }
.stage__photo { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: 75% 50%; filter: grayscale(1) contrast(1.2) brightness(.28); z-index: -2; }
.stage::before { content: ""; position: absolute; inset: 0; z-index: -1; background: radial-gradient(ellipse at 50% 40%, rgba(11,11,11,.2), var(--bg) 75%); }
.stage .dots { left: 10%; top: 12%; width: 50%; height: 60%; -webkit-mask-image: radial-gradient(ellipse, #000 20%, transparent 70%); mask-image: radial-gradient(ellipse, #000 20%, transparent 70%); }
.top { display: flex; justify-content: space-between; align-items: center; padding: 16px 24px; }
.box { width: min(480px, 100% - 32px); margin: 64px auto 64px; display: flex; flex-direction: column; gap: 22px; }
.box h1 { margin: 10px 0 0; font-size: 52px; font-weight: 900; line-height: 1.05; letter-spacing: .02em; }
.box h1 span { display: block; color: #bdbdbd; font-size: .6em; margin-top: 8px; }
.box p.note { margin: 0; font-size: 15px; line-height: 1.7; color: #cfcfcf; }
.phone { display: flex; }
.phone span { display: grid; place-items: center; width: 72px; height: 52px; background: #1b1b1b; border: 1px solid #333; border-right: 0; font-family: var(--mono); font-size: 15px; color: var(--grey); }
.code { display: flex; gap: 8px; }
.code .btn { height: 52px; padding: 0 16px; font-size: 14px; white-space: nowrap; color: var(--grey); cursor: default; }
.terms { font-size: 13px; color: var(--grey); line-height: 1.7; }
@media (max-width: 720px) { .box { margin-top: 40px; } .box h1 { font-size: 42px; } }
</style>
</head>
<body>
<section class="stage">
  <img class="stage__photo" src="img/plates.jpg" alt="" aria-hidden="true">
  <div class="dots" aria-hidden="true"></div>
  <div class="top"><a class="back" href="coach.html">← BACK</a><span class="tag tag--grey">力量举教练点评</span></div>
  <form class="box" aria-labelledby="login-h">
    <div><span class="tag">SIGN IN // 手机号登录</span><h1 id="login-h">登录<span>登录后写点评</span></h1></div>
    <p class="note">只用手机号登录。点评里只显示你起的昵称，不会显示手机号。</p>
    <label class="field"><span>手机号</span><div class="phone"><span>+86</span><input class="input" type="tel" value="138 0000 0000" aria-label="手机号"></div></label>
    <label class="field"><span>验证码</span><div class="code"><input class="input" type="text" inputmode="numeric" placeholder="6 位验证码" aria-label="验证码"><span class="btn btn--dark" aria-disabled="true">重新获取 56s</span></div></label>
    <a class="btn btn--solid btn--block" href="write.html">登录</a>
    <p class="terms">登录即表示同意 <a class="link-red" href="home.html">用户协议</a> 和 <a class="link-red" href="home.html">隐私政策</a>。</p>
  </form>
</section>
</body>
</html>
